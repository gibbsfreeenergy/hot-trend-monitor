name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hot-trend-monitor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Push image to GHCR
        run: |
          docker push "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:${{ github.sha }}"

      - name: Export image archive
        run: docker save "${{ env.IMAGE }}:${{ github.sha }}" | gzip -1 > hot-trend-monitor.tar.gz

      - name: Upload image archive
        id: image-artifact
        uses: actions/upload-artifact@v4
        with:
          name: hot-trend-monitor-image
          path: hot-trend-monitor.tar.gz
          retention-days: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.image-artifact.outputs.artifact-id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          NEWSNOW_API_URL: ${{ secrets.NEWSNOW_API_URL }}
          NEWSNOW_XHS_ID: ${{ secrets.NEWSNOW_XHS_ID }}
          XHS_TREND_URL: ${{ secrets.XHS_TREND_URL }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
          COLLECT_INTERVAL_SECONDS: ${{ secrets.COLLECT_INTERVAL_SECONDS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          envs: IMAGE,GITHUB_TOKEN,GITHUB_REPOSITORY,ARTIFACT_ID,DATABASE_URL,REDIS_URL,NEWSNOW_API_URL,NEWSNOW_XHS_ID,XHS_TREND_URL,XHS_COOKIE,HTTP_PROXY_URL,COLLECT_INTERVAL_SECONDS
          script_stop: true
          script: |
            set -eu
            install -d -m 700 /opt/hot-trend-monitor
            umask 077
            cat > /opt/hot-trend-monitor/.env <<EOF
            APP_ENV=production
            APP_PORT=8080
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            NEWSNOW_API_URL=${NEWSNOW_API_URL}
            NEWSNOW_XHS_ID=${NEWSNOW_XHS_ID}
            XHS_TREND_URL=${XHS_TREND_URL}
            XHS_COOKIE=${XHS_COOKIE}
            HTTP_PROXY_URL=${HTTP_PROXY_URL}
            COLLECT_INTERVAL_SECONDS=${COLLECT_INTERVAL_SECONDS}
            COLLECT_ON_STARTUP=true
            ALLOW_SAMPLE_FALLBACK=true
            LOG_LEVEL=INFO
            EOF

            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/hot-trend-monitor-artifact.zip
            python3 - /tmp/hot-trend-monitor-artifact.zip <<'PY'
            import sys
            import zipfile

            with zipfile.ZipFile(sys.argv[1]) as archive:
                archive.extract("hot-trend-monitor.tar.gz", "/tmp")
            PY
            rm -f /tmp/hot-trend-monitor-artifact.zip
            gzip -dc /tmp/hot-trend-monitor.tar.gz | docker load
            rm -f /tmp/hot-trend-monitor.tar.gz
            docker rm -f hot-trend-monitor 2>/dev/null || true
            docker run -d --name hot-trend-monitor --restart unless-stopped --network host --env-file /opt/hot-trend-monitor/.env "$IMAGE"
            sleep 5
            curl --fail --silent --show-error http://127.0.0.1:8080/api/health
            docker image prune -f --filter "until=168h" >/dev/null || true
