name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hot-trend-monitor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          NEWSNOW_API_URL: ${{ secrets.NEWSNOW_API_URL }}
          NEWSNOW_XHS_ID: ${{ secrets.NEWSNOW_XHS_ID }}
          XHS_TREND_URL: ${{ secrets.XHS_TREND_URL }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
          COLLECT_INTERVAL_SECONDS: ${{ secrets.COLLECT_INTERVAL_SECONDS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          envs: IMAGE,GHCR_TOKEN,GHCR_USERNAME,DATABASE_URL,REDIS_URL,NEWSNOW_API_URL,NEWSNOW_XHS_ID,XHS_TREND_URL,XHS_COOKIE,HTTP_PROXY_URL,COLLECT_INTERVAL_SECONDS
          script_stop: true
          script: |
            set -eu
            install -d -m 700 /opt/hot-trend-monitor
            umask 077
            cat > /opt/hot-trend-monitor/.env <<EOF
            APP_ENV=production
            APP_PORT=8080
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            NEWSNOW_API_URL=${NEWSNOW_API_URL}
            NEWSNOW_XHS_ID=${NEWSNOW_XHS_ID}
            XHS_TREND_URL=${XHS_TREND_URL}
            XHS_COOKIE=${XHS_COOKIE}
            HTTP_PROXY_URL=${HTTP_PROXY_URL}
            COLLECT_INTERVAL_SECONDS=${COLLECT_INTERVAL_SECONDS}
            COLLECT_ON_STARTUP=true
            ALLOW_SAMPLE_FALLBACK=true
            LOG_LEVEL=INFO
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker rm -f hot-trend-monitor 2>/dev/null || true
            docker run -d --name hot-trend-monitor --restart unless-stopped --network host --env-file /opt/hot-trend-monitor/.env "$IMAGE"
            sleep 5
            curl --fail --silent --show-error http://127.0.0.1:8080/api/health
            docker image prune -f --filter "until=168h" >/dev/null || true

